<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelican Biking Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Scene container with weather changing animation over 20 seconds total (5s per phase) */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            animation: weatherCycle 20s infinite linear;
        }

        @keyframes weatherCycle {
            0%, 23% {
                background: linear-gradient(to bottom, #87CEEB, #E0F6FF); /* Sunny */
            }
            25%, 48% {
                background: linear-gradient(to bottom, #B0C4DE, #D3D3D3); /* Cloudy */
            }
            50%, 73% {
                background: linear-gradient(to bottom, #4A607A, #2C3E50); /* Rainy */
            }
            75%, 98% {
                background: linear-gradient(to bottom, #87CEEB, #E0F6FF); /* Sunny */
            }
            100% {
                background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            }
        }

        /* Sun and Clouds visibility controlled by keyframes */
        .sun {
            position: absolute;
            top: 50px;
            right: 80px;
            width: 80px;
            height: 80px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 40px #FFA500;
            animation: sunAnim 20s infinite;
        }

        @keyframes sunAnim {
            0%, 23% { opacity: 1; transform: scale(1); }
            25%, 48% { opacity: 0.3; transform: scale(0.8); }
            50%, 73% { opacity: 0; transform: scale(0.5); }
            75%, 100% { opacity: 1; transform: scale(1); }
        }

        .clouds {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: transparent;
            opacity: 0;
            animation: cloudAnim 20s infinite;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
        }

        .c1 { width: 150px; height: 50px; top: 40px; left: 10%; animation: drift 15s linear infinite; }
        .c2 { width: 200px; height: 70px; top: 80px; left: 60%; animation: drift 20s linear infinite; }
        .c3 { width: 120px; height: 40px; top: 30px; left: 80%; animation: drift 12s linear infinite; }

        @keyframes drift {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }

        @keyframes cloudAnim {
            0%, 23% { opacity: 0.2; }
            25%, 73% { opacity: 1; }
            75%, 100% { opacity: 0.2; }
        }

        /* Rain container */
        .rain {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            animation: rainAnim 20s infinite;
        }

        @keyframes rainAnim {
            0%, 48% { opacity: 0; }
            50%, 73% { opacity: 1; }
            75%, 100% { opacity: 0; }
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: rgba(255, 255, 255, 0.6);
            bottom: 100%;
            animation: fall 0.5s linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0); }
            100% { transform: translateY(105vh); }
        }

        /* Ground and road */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: #2E8B57;
            border-top: 5px solid #228B22;
        }

        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90px;
            background: #333;
            border-top: 4px solid #555;
        }

        .road-line {
            position: absolute;
            top: 40px;
            width: 100%;
            height: 6px;
            background: repeating-linear-gradient(90deg, #FFF, #FFF 40px, transparent 40px, transparent 80px);
            animation: moveRoad 1s linear infinite;
        }

        @keyframes moveRoad {
            0% { background-position: 0 0; }
            100% { background-position: -80px 0; }
        }

        /* Pelican riding a bike container */
        .cyclist {
            position: absolute;
            bottom: 60px;
            left: calc(50% - 75px);
            width: 150px;
            height: 180px;
            animation: bounce 0.6s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* Pelican components */
        .pelican-body {
            position: absolute;
            top: 50px;
            left: 45px;
            width: 60px;
            height: 70px;
            background: #F5F5F5;
            border-radius: 50% 50% 40% 40%;
            box-shadow: inset -5px -5px 0px rgba(0,0,0,0.05);
        }

        .pelican-wing {
            position: absolute;
            top: 60px;
            left: 55px;
            width: 35px;
            height: 50px;
            background: #E0E0E0;
            border-radius: 30% 70% 50% 50%;
            transform: rotate(15deg);
        }

        .pelican-neck {
            position: absolute;
            top: 15px;
            left: 70px;
            width: 25px;
            height: 50px;
            background: #F5F5F5;
            border-radius: 20px;
            transform: rotate(20deg);
        }

        .pelican-head {
            position: absolute;
            top: 0px;
            left: 70px;
            width: 35px;
            height: 35px;
            background: #F5F5F5;
            border-radius: 50%;
        }

        .pelican-eye {
            position: absolute;
            top: 10px;
            left: 88px;
            width: 5px;
            height: 5px;
            background: #000;
            border-radius: 50%;
        }

        /* Beak and pouch */
        .pelican-beak {
            position: absolute;
            top: 13px;
            left: 95px;
            width: 45px;
            height: 12px;
            background: #FFA500;
            border-radius: 0 50% 50% 0;
        }

        .pelican-pouch {
            position: absolute;
            top: 20px;
            left: 98px;
            width: 35px;
            height: 22px;
            background: #FF8C00;
            border-radius: 0 0 50% 50%;
        }

        /* Bicycle components */
        .bike {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 130px;
            height: 110px;
        }

        .wheel {
            position: absolute;
            bottom: 0;
            width: 45px;
            height: 45px;
            border: 4px dashed #222;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            animation: spin 0.8s linear infinite;
        }

        .front-wheel { right: 0; }
        .back-wheel { left: 0; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .frame-line {
            position: absolute;
            background: #333;
        }

        .chain-stay {
            bottom: 22px;
            left: 22px;
            width: 45px;
            height: 4px;
            transform: rotate(-10deg);
        }

        .seat-stay {
            bottom: 22px;
            left: 45px;
            width: 50px;
            height: 4px;
            transform: rotate(55deg);
        }

        .down-tube {
            bottom: 22px;
            left: 45px;
            width: 60px;
            height: 4px;
            transform: rotate(-45deg);
        }

        .seat-tube {
            bottom: 22px;
            left: 62px;
            width: 50px;
            height: 4px;
            transform: rotate(70deg);
        }

        .handlebar {
            top: 25px;
            right: 32px;
            width: 25px;
            height: 25px;
            border-top: 4px solid #333;
            border-right: 4px solid #333;
            border-radius: 0 8px 0 0;
        }

        .seat {
            position: absolute;
            top: 28px;
            left: 55px;
            width: 20px;
            height: 8px;
            background: #111;
            border-radius: 50%;
        }

        .pedal {
            position: absolute;
            bottom: 12px;
            left: 43px;
            width: 15px;
            height: 15px;
            border: 2px solid #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .pedal::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 7px;
            height: 7px;
            background: #666;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Weather Elements -->
        <div class="sun"></div>

        <div class="clouds">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
        </div>

        <div class="rain" id="rainContainer"></div>

        <!-- Environment -->
        <div class="ground"></div>
        <div class="road">
            <div class="road-line"></div>
        </div>

        <!-- Pelican Cycling Character -->
        <div class="cyclist">
            <div class="pelican-body"></div>
            <div class="pelican-wing"></div>
            <div class="pelican-neck"></div>
            <div class="pelican-head">
                <div class="pelican-eye"></div>
            </div>
            <div class="pelican-beak"></div>
            <div class="pelican-pouch"></div>

            <div class="bike">
                <div class="wheel back-wheel"></div>
                <div class="wheel front-wheel"></div>
                <div class="frame-line chain-stay"></div>
                <div class="frame-line seat-stay"></div>
                <div class="frame-line down-tube"></div>
                <div class="frame-line seat-tube"></div>
                <div class="handlebar"></div>
                <div class="seat"></div>
                <div class="pedal"></div>
            </div>
        </div>
    </div>

    <script>
        // Generate rain dynamically
        const rainContainer = document.getElementById('rainContainer');
        const dropCount = 60;
        for (let i = 0; i < dropCount; i++) {
            const drop = document.createElement('div');
            drop.classList.add('raindrop');
            drop.style.left = `${Math.random() * 100}%`;
            drop.style.animationDuration = `${0.4 + Math.random() * 0.3}s`;
            drop.style.animationDelay = `${Math.random() * 2}s`;
            rainContainer.appendChild(drop);
        }
    </script>
</body>
</html>
